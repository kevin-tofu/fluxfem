[project]
name = "fluxfem"
version = "0.1.0"
description = ""
authors = [
    {name = "Kevin-Tofu",email = "koheitech001@gmail.com"}
]
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "pyvista (>=0.46.4,<0.47.0)",
    "meshio (>=5.3.5,<6.0.0)",
    "matplotlib (>=3.10.7,<4.0.0)",
    # Note: jax versioning currently around 0.4.x. Allow up to next minor.
    "jax (>=0.4.33,<0.5.0)",
    "jaxlib (>=0.4.33,<0.5.0)"
]


[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"

[dependency-groups]
dev = [
    "pytest (>=9.0.2,<10.0.0)",
    "scikit-fem (>=11.0.0,<12.0.0)"
]
