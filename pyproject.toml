[project]
name = "fluxfem"
version = "0.1.0"
description = ""
authors = [
    {name = "Kevin-Tofu",email = "koheitech001@gmail.com"}
]
readme = "README.md"
requires-python = ">=3.10,<3.14"
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
]
dependencies = [
    "pyvista (>=0.46.4,<0.47.0)",
    "meshio (>=5.3.5,<6.0.0)",
    "matplotlib (>=3.10.7,<4.0.0)",
    # Note: jax versioning currently around 0.8.x. Allow up to next minor.
    "jax (==0.8.2)",
    "jaxlib (==0.8.2)"
]

[tool.poetry]
name = "fluxfem"
version = "0.1.0"
description = "FluxFEM: A weak-form-centric differentiable finite element framework in JAX"
authors = ["Kevin-Tofu <koheitech001@gmail.com>"]
readme = "README.md"
license = "Apache-2.0"
packages = [
  { include = "fluxfem", from = "fluxfem" }
]


[tool.poetry.dependencies]
python = ">=3.10,<3.14"
pyvista = ">=0.46.4,<0.47.0"
meshio = ">=5.3.5,<6.0.0"
matplotlib = ">=3.10.7,<4.0.0"
jax = "==0.8.2"
jaxlib = "==0.8.2"


[dependency-groups]
dev = [
    "pytest (>=9.0.2,<10.0.0)",
    "scikit-fem (>=11.0.0,<12.0.0)",
    "sphinx (>=7.4.0,<8.0.0)",
    "sphinx-rtd-theme (>=2.0.0,<3.0.0)",
    "sphinx-sitemap (>=2.6.0,<3.0.0)",
    "myst-parser (>=3.0.0,<4.0.0)",
    "pytest-cov (>=7.0.0,<8.0.0)"
]

[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"
